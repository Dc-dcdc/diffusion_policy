name: mujoco_image

image_shape: [3, 240, 320]
dataset_path: data/demo_pusht_mujoco  

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    #Wrist Camera
    camera_0:
      shape: ${task.image_shape}
      type: rgb
    #Front Camera
    camera_1:
      shape: ${task.image_shape}
      type: rgb

    robot_eef_pose:
      shape: [2]
      type: low_dim
  action: 
    shape: [2]

env_runner:
  _target_: diffusion_policy.env_runner.pusht_mujoco_runner.MujocoPushTImageRunner
  # output_dir: ${output_dir}
  xml_path: /home/dc/diffusion_policy/diffusion_policy/env/pusht/mujoco_ur5e/pusht.xml
  n_train: 0  #训练集评估次数
  n_train_vis: 0  #评估后存下的视频数
  n_test: 5  #测试集评估次数
  n_test_vis: 5  #测试集评估存下视频数量
  max_steps: 1000
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  shape_meta: ${task.shape_meta}

dataset:
  _target_: diffusion_policy.dataset.real_pusht_image_dataset.RealPushTImageDataset   #mp4
  # _target_: diffusion_policy.dataset.mujoco_pusht_image_dataset.MujocoPushTImageDataset  #zarr
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  use_cache: True
  seed: 42
  val_ratio: 0.00
  max_train_episodes: null
  delta_action: False

